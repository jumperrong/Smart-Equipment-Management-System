services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sems-backend
    restart: unless-stopped
    environment:
      - SQLALCHEMY_DATABASE_URI=sqlite:////data/app.db
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key-in-production}
      - BACKEND_CORS_ORIGINS=["*"]
    volumes:
      - sems-data:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - sems-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sems-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - sems-net

volumes:
  sems-data:
    name: sems-data

networks:
  sems-net:
    name: sems-net
